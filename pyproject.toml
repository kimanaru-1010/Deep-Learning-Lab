[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minidl-lab"
version = "0.1.0"
description = "A NumPy learning lab: students implement the deep learning core"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "matplotlib>=3.8,<4", "tqdm>=4.66,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.9,<1", "mypy>=1.10,<2"]

[tool.setuptools]
packages = ["minidl", "minidl.core", "minidl.nn", "minidl.losses", "minidl.optim", "minidl.data", "minidl.training", "minidl.utils", "models", "experiments"]
package-dir = {minidl = "src/minidl"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["student: exercises that may raise StudentTODO until implemented"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["setup-records"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
files = ["src/minidl"]
